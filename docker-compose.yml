services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d users_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

    volumes:
      - kafka-data:/tmp/kraft-combined-logs

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  discovery-server:
    build:
      context: ./discovery-server
      dockerfile: ../Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: "8761"
      SPRING_APPLICATION_NAME: discovery-server

      SPRING_APPLICATION_JSON: >-
        {
          "eureka": {
            "client": {
              "register-with-eureka": false,
              "fetch-registry": false
            }
          }
        }

    ports:
      - "8761:8761"

  user-service:
    build:
      context: ./aston-spring-rest
      dockerfile: ../Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: "8081"
      SPRING_APPLICATION_NAME: user-service

      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/application.properties

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/users_db
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app_password

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      NOTIFICATION_SERVICE_URL: http://notification-service:8082

      SPRING_APPLICATION_JSON: >-
        {
          "eureka": {
            "client": {
              "serviceUrl": {
                "defaultZone": "http://discovery-server:8761/eureka/"
              }
            },
            "instance": {
              "prefer-ip-address": true
            }
          }
        }

    ports:
      - "8081:8081"
    volumes:
      - ./config:/config:ro

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_started

  notification-service:
    build:
      context: ./aston-notification-service
      dockerfile: ../Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: "8082"
      SPRING_APPLICATION_NAME: notification-service

      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/application.properties

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      SPRING_APPLICATION_JSON: >-
        {
          "eureka": {
            "client": {
              "serviceUrl": {
                "defaultZone": "http://discovery-server:8761/eureka/"
              }
            },
            "instance": {
              "prefer-ip-address": true
            }
          }
        }

    ports:
      - "8082:8082"
    volumes:
      - ./config:/config:ro

    depends_on:
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_started

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: ../Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      SPRING_APPLICATION_NAME: api-gateway

      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/application.properties

      SPRING_APPLICATION_JSON: >-
        {
          "eureka": {
            "client": {
              "serviceUrl": {
                "defaultZone": "http://discovery-server:8761/eureka/"
              }
            },
            "instance": {
              "prefer-ip-address": true
            }
          }
        }

    ports:
      - "8080:8080"
    volumes:
      - ./config:/config:ro

    depends_on:
      discovery-server:
        condition: service_started
      user-service:
        condition: service_started
      notification-service:
        condition: service_started

volumes:
  postgres-data:
  kafka-data: